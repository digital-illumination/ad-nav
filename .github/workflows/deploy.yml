name: Deploy to Azure Container Apps

# Builds the site image, pushes it to the shared Digital Illumination
# registry (`digitalillumination`) and rolls the `ad-nav` Container App in
# `di-website-env` (resource group `di-website`, UK South) onto it.
#
# Sign-in is OpenID Connect to the user-assigned identity `id-adnav-ci`,
# which holds a federated credential for this repository's `main` branch,
# AcrPush on the registry and Contributor on the `ad-nav` Container App only.
# No secret is stored in GitHub: the three ids below are repository
# variables, and the app's own secrets live in Key Vault (`di-website-kv`),
# read at runtime by the app's managed identity.
#
# Scale: 0 to 3 replicas, the same as Cloud Run's --min-instances 0. The
# deploy never changes min replicas; set it on the app if a warm replica is
# wanted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: di-website
  AZURE_CONTAINER_APP: ad-nav
  ACR_NAME: digitalillumination
  ACR_LOGIN_SERVER: digitalillumination.azurecr.io
  IMAGE_NAME: ad-nav

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login
        run: az acr login --name "$ACR_NAME" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.tag.outputs.tag }}" \
            --revision-suffix "${{ steps.tag.outputs.tag }}-${{ github.run_attempt }}"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          # Allow for a scale-from-zero start.
          for path in / /api/context /.well-known/oauth-authorization-server; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://$FQDN$path")
            echo "$path returned HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Smoke test failed on $path (HTTP $status)"
              exit 1
            fi
          done
